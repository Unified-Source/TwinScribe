# The site the project's domain serves, assembled from site/ and the documentation's pictures
# by tools/build_site.py and published through GitHub Pages on every change to those files.
name: site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/images/**
      - docs/media/**
      - assets/twinscribe.ico
      - tools/build_site.py
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Assemble the site and check its references
        run: python tools/build_site.py --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
