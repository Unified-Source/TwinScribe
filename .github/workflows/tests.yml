# The test suite on Windows and Linux, headless. Engine libraries are installed so that the
# code paths that probe them run; the tests that need a model or an audio decoder on the
# search path skip, as they do on any machine without those.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Libraries Qt needs without a display (Linux)
        if: runner.os == 'Linux'
        run: |
          # The runner image carries third-party package sources whose indexes fail at times; the
          # libraries below come from the distribution's own, so a failed update is not fatal.
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libglib2.0-0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libasound2t64 ffmpeg

      - name: Install the package with its extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[engines,app,ffmpeg,dev]"

      - name: Report the machine as the tool sees it
        run: python -m twinscribe check

      - name: Run the suite
        run: python -m pytest -p no:cacheprovider -q -rs
