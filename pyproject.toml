[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twinscribe"
version = "0.0.1"
description = "Offline transcription with speaker labels for long recordings that will be relied on."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Abdirahman Kulmiye", email = "abe.kulmiye@uniflux.io" }]
keywords = ["speech recognition", "transcription", "diarization", "offline", "whisper", "parakeet"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
# faster-whisper needs CTranslate2, which publishes no wheel for Windows on ARM; sherpa-onnx
# covers every platform and carries the ONNX detector used there.
engines = [
  "faster-whisper>=1.2,<2; sys_platform != 'win32' or platform_machine != 'ARM64'",
  "sherpa-onnx>=1.13,<2",
]
cuda = [
  "nvidia-cublas-cu12",
  "nvidia-cudnn-cu12",
]
ffmpeg = [
  "imageio-ffmpeg>=0.5",
]
app = [
  "PySide6>=6.8",
]
dev = [
  "pytest>=8",
]

[project.scripts]
twinscribe = "twinscribe.cli:main"

[project.gui-scripts]
twinscribe-app = "twinscribe.app.main:main"

[project.urls]
Homepage = "https://github.com/Unified-Source/twinscribe"

[tool.setuptools.packages.find]
include = ["twinscribe*"]

[tool.setuptools.package-data]
twinscribe = ["text/_whisper_normalizer/*.json", "text/_whisper_normalizer/LICENSE", "text/_whisper_normalizer/VENDORED.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
